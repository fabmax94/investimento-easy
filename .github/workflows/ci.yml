name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Build, lint e testes (JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # ktlint + detekt + testes + cobertura mínima agregada (Kover)
      - name: Check
        run: ./gradlew check --continue

      - name: Relatório de cobertura
        if: always()
        run: ./gradlew koverLog koverXmlReport

      - name: Publicar relatórios
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
