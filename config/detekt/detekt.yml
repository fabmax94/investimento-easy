# Sobrescreve apenas o necessário; o restante vem da config padrão do detekt.
naming:
  FunctionNaming:
    # Testes usam nomes descritivos em crases, prefixados pela regra (ex.: `R3 ...`).
    excludes: ['**/test/**']
    # Convenção do Compose: funções @Composable em PascalCase.
    ignoreAnnotated: ['Composable']
  MatchingDeclarationName:
    active: false
style:
  MagicNumber:
    excludes: ['**/test/**', '**/testing/**']
    # Medidas de layout (16.dp, 12.sp) são o próprio design, não números mágicos.
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true
  MaxLineLength:
    maxLineLength: 140
    excludes: ['**/test/**']
  ReturnCount:
    max: 3
    excludeGuardClauses: true
complexity:
  LongMethod:
    excludes: ['**/test/**']
    ignoreAnnotated: ['Composable']
  LongParameterList:
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    excludes: ['**/test/**']
